<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set password — Group Chat</title>
  </head>
  <body class="auth-page">
    <main class="auth-wrapper">
      <div class="brand-header">
        <div class="brand-logo"><i class="bi bi-whatsapp"></i></div>
        <span class="brand-name">Group Chat Web</span>
      </div>

      <div class="auth-card">
        <h1 class="auth-title" id="pageTitle">Create a password</h1>
        <p class="auth-subtitle" id="pageSubtitle">
          Secure your account for
          <strong id="verifiedEmailText" class="text-dark"></strong>
        </p>

        <div
          id="alert-box"
          class="alert d-none small py-2 px-3 mb-3"
          role="alert"
        ></div>

        <form id="password-form" novalidate>
          <div class="mb-3">
            <label for="password" class="form-label">New Password</label>
            <div class="password-wrapper">
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="At least 6 characters"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="password-toggle"
                id="togglePassword"
                aria-label="Toggle password"
              >
                <i class="bi bi-eye" id="toggleIcon"></i>
              </button>
            </div>
            <div class="invalid-feedback">
              Password must be at least 6 characters long.
            </div>
          </div>

          <div class="mb-4">
            <label for="confirmPassword" class="form-label">Confirm password</label>
            <input
              type="password"
              class="form-control"
              id="confirmPassword"
              placeholder="Re-enter password"
              autocomplete="new-password"
              required
            />
            <div class="invalid-feedback">Passwords do not match.</div>
          </div>

          <button type="submit" id="saveBtn" class="btn-auth">
            <span id="btnText">Complete Registration</span>
            <span
              id="btnSpinner"
              class="spinner-border spinner-border-sm ms-2 d-none"
              role="status"
            ></span>
          </button>
        </form>
      </div>
    </main>

    <script type="module" src="/src/scripts/set-password.js"></script>
  </body>
</html>
