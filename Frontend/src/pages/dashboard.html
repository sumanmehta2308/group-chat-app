<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group Chat Web</title>
  </head>
  <body class="chat-body">
    <div class="chat-app-shell" id="chatAppShell">
      <aside class="chat-sidebar" id="chatSidebar">
        <header class="sidebar-header">
          <div class="d-flex align-items-center gap-2 overflow-hidden">
            <div class="user-avatar" id="currentUserAvatar">U</div>
            <div class="overflow-hidden">
              <div class="fw-semibold text-dark small text-truncate" id="currentUserName">Loading...</div>
              <div class="text-success" style="font-size: 11px;">● Online</div>
            </div>
          </div>
          <div class="d-flex align-items-center gap-1">
            <button
              type="button"
              class="icon-btn"
              id="openCreateGroupBtn"
              title="Create New Group"
            >
              <i class="bi bi-people-fill"></i>
            </button>
            <button
              type="button"
              class="icon-btn text-danger"
              id="logoutBtn"
              title="Logout"
            >
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>
        </header>

        <div class="sidebar-search">
          <form id="directEmailJoinForm" class="search-input-wrap">
            <i class="bi bi-search text-muted"></i>
            <input
              type="text"
              id="chatSearchInput"
              placeholder="Enter email & press Enter to join room..."
              autocomplete="off"
            />
          </form>
        </div>

        <div class="chat-list" id="chatList">
          <div class="chat-item active" id="globalRoomItem" data-chat-type="global">
            <div class="chat-avatar">GC</div>
            <div class="chat-item-meta">
              <div class="chat-item-top">
                <span class="chat-item-name">Group Chat Room</span>
                <span class="chat-item-time" id="sidebarLastTime"></span>
              </div>
              <div class="chat-item-preview" id="sidebarLastPreview">
                Global group chat
              </div>
            </div>
          </div>

          <div id="groupsListContainer"></div>
          <div id="usersListContainer"></div>
        </div>
      </aside>

      <section class="chat-main" id="chatMain">
        <header class="chat-header">
          <div class="d-flex align-items-center gap-2 overflow-hidden" id="chatHeaderInfo">
            <button
              type="button"
              class="icon-btn sidebar-toggle-btn"
              id="mobileBackBtn"
              aria-label="Toggle Sidebar"
            >
              <i class="bi bi-list"></i>
            </button>
            <div class="chat-avatar" id="activeChatAvatar">GC</div>
            <div class="overflow-hidden">
              <h2 class="chat-title mb-0 text-truncate" id="activeChatTitle">Group Chat Room</h2>
              <p class="chat-subtitle mb-0 text-truncate" id="activeChatStatus">
                All verified members
              </p>
            </div>
          </div>
        </header>

        <div class="messages-viewport" id="messagesViewport">
          <div class="date-divider">
            <span id="chatModeLabel">GROUP MESSAGES</span>
          </div>
          <div id="messagesContainer" class="messages-stack"></div>
        </div>

        <button
          type="button"
          id="scrollBottomBtn"
          class="scroll-bottom-btn d-none"
          aria-label="Scroll to latest message"
        >
          <i class="bi bi-chevron-down"></i>
        </button>

        <div
          id="selectedFileBar"
          class="d-none px-3 py-2 bg-light border-top d-flex align-items-center justify-content-between"
        >
          <div class="small text-truncate text-dark">
            <i class="bi bi-paperclip me-1 text-success"></i>
            <span id="selectedFileName">file.png</span>
          </div>
          <button type="button" class="btn btn-sm text-danger p-0" id="clearSelectedFileBtn">
            <i class="bi bi-x-circle-fill"></i>
          </button>
        </div>

        <footer class="chat-composer">
          <form id="messageForm" class="composer-form">
            <input
              type="file"
              id="mediaFileInput"
              class="d-none"
              accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip"
            />
            <button
              type="button"
              id="attachMediaBtn"
              class="icon-btn"
              title="Attach Image, Video or File"
            >
              <i class="bi bi-paperclip fs-5"></i>
            </button>
            <input
              type="text"
              id="messageInput"
              class="composer-input"
              placeholder="Type a message or attach media"
              autocomplete="off"
            />
            <button type="submit" id="sendBtn" class="send-btn" title="Send">
              <i class="bi bi-send-fill"></i>
            </button>
          </form>
        </footer>
      </section>
    </div>

    <div
      id="createGroupModal"
      class="d-none position-fixed top-0 start-0 w-100 h-100 align-items-center justify-content-center"
      style="background: rgba(11, 20, 26, 0.55); z-index: 1050;"
    >
      <div class="bg-white rounded-3 p-4 shadow" style="width: 92%; max-width: 420px;">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h5 class="mb-0 fw-semibold">Create New Group</h5>
          <button type="button" class="icon-btn" id="closeCreateGroupBtn">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        <form id="createGroupForm">
          <div class="mb-3">
            <label class="form-label">Group Name</label>
            <input
              type="text"
              id="groupNameInput"
              class="form-control"
              placeholder="e.g., NIT Raipur Project Team"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Add Members by Email (comma separated)</label>
            <input
              type="text"
              id="groupMembersInput"
              class="form-control"
              placeholder="user1@gmail.com, user2@gmail.com"
            />
            <div class="form-text">Only registered & verified users will be added.</div>
          </div>
          <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-light" id="cancelCreateGroupBtn">
              Cancel
            </button>
            <button type="submit" class="btn text-white" style="background-color: #00a884;">
              Create Group
            </button>
          </div>
        </form>
      </div>
    </div>

    <div
      id="groupMembersModal"
      class="d-none position-fixed top-0 start-0 w-100 h-100 align-items-center justify-content-center"
      style="background: rgba(11, 20, 26, 0.55); z-index: 1050;"
    >
      <div class="bg-white rounded-3 p-4 shadow" style="width: 92%; max-width: 420px;">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <div>
            <h5 class="mb-0 fw-semibold" id="modalGroupName">Group Info</h5>
            <small class="text-muted" id="modalGroupCount">0 members</small>
          </div>
          <button type="button" class="icon-btn" id="closeGroupMembersBtn">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
        <div id="groupMembersList" style="max-height: 280px; overflow-y: auto;"></div>
      </div>
    </div>

    <script type="module" src="/src/scripts/dashboard.js"></script>
  </body>
</html>
