<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group Chat Web</title>
  </head>
  <body class="chat-body">
    <div class="chat-app-shell">
      <aside class="chat-sidebar" id="chatSidebar">
        <header class="sidebar-header">
          <div class="d-flex align-items-center gap-2">
            <div class="user-avatar" id="currentUserAvatar">U</div>
            <div>
              <div class="fw-semibold text-dark small" id="currentUserName">Loading...</div>
              <div class="text-success" style="font-size: 11px;">● Online</div>
            </div>
          </div>
          <div class="d-flex align-items-center gap-2">
            <button
              type="button"
              class="icon-btn text-danger"
              id="logoutBtn"
              title="Logout"
            >
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>
        </header>

        <div class="sidebar-search">
          <div class="search-input-wrap">
            <i class="bi bi-search text-muted"></i>
            <input
              type="text"
              id="chatSearchInput"
              placeholder="Search messages"
              autocomplete="off"
            />
          </div>
        </div>

        <div class="chat-list" id="chatList">
          <div class="chat-item active" id="globalRoomItem">
            <div class="chat-avatar">GC</div>
            <div class="chat-item-meta">
              <div class="chat-item-top">
                <span class="chat-item-name">Group Chat Room</span>
                <span class="chat-item-time" id="sidebarLastTime"></span>
              </div>
              <div class="chat-item-preview" id="sidebarLastPreview">
                Click to view messages
              </div>
            </div>
          </div>
        </div>
      </aside>

      <section class="chat-main" id="chatMain">
        <header class="chat-header">
          <div class="d-flex align-items-center gap-2">
            <button
              type="button"
              class="icon-btn d-md-none"
              id="mobileBackBtn"
              aria-label="Back"
            >
              <i class="bi bi-arrow-left"></i>
            </button>
            <div class="chat-avatar">GC</div>
            <div>
              <h2 class="chat-title mb-0">Group Chat Room</h2>
              <p class="chat-subtitle mb-0" id="activeChatStatus">
                All verified members
              </p>
            </div>
          </div>
        </header>

        <div class="messages-viewport" id="messagesViewport">
          <div class="date-divider">
            <span>GROUP MESSAGES</span>
          </div>
          <div id="messagesContainer" class="messages-stack"></div>
        </div>

        <button
          type="button"
          id="scrollBottomBtn"
          class="scroll-bottom-btn d-none"
          aria-label="Scroll to latest message"
        >
          <i class="bi bi-chevron-down"></i>
        </button>

        <footer class="chat-composer">
          <form id="messageForm" class="composer-form">
            <input
              type="text"
              id="messageInput"
              class="composer-input"
              placeholder="Type a message"
              autocomplete="off"
            />
            <button type="submit" id="sendBtn" class="send-btn" title="Send">
              <i class="bi bi-send-fill"></i>
            </button>
          </form>
        </footer>
      </section>
    </div>

    <script type="module" src="/src/scripts/dashboard.js"></script>
  </body>
</html>
